    <!-- Icons. Vite rewrites these against `base`, so they resolve under the
         /portfolio/ subpath as well as at a domain root. -->
    <link rel="icon" type="image/svg+xml" href="/portfolio/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/portfolio/assets/img/profile.jpg" />

    <!-- Open Graph / Twitter -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@RahatZdn" />

    <!-- Fonts. Preconnect first so the handshake overlaps the CSS request, and
         `display=swap` so text is never blocked on the download. Both faces
         have a full system fallback stack in global.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Md. Rahat Hossain",

    <!-- Paint the page background before the CSS bundle arrives, and restore
         the saved theme so there is no light flash on a dark-theme reload. -->
    <style>
      html { background: #04060b; }
      html[data-theme='light'] { background: #eef2f8; }
      body { margin: 0; }
    </style>
    <script>
      try {
        var t = localStorage.getItem('rh-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/portfolio/build/index-_-wWf4KP.js"></script>
    <link rel="modulepreload" crossorigin href="/portfolio/build/react-B8AvdffO.js">
